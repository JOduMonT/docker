services:
  daily-stars-explorer:
    image: 'ghcr.io/emanuelef/daily-stars-explorer:20260913-1246'
    container_name: daily-stars-explorer
    restart: unless-stopped
    # Runs as root with no privilege-drop dance (plain Go binary entrypoint, no
    # s6-overlay/PUID-PGID pattern — see Dockerfile upstream). Live-tested with
    # zero extra capabilities; don't add any without re-testing (docs/HARD-WON-GOTCHAS.md).
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "127.0.0.1:${DAILY_STARS_PORT:-8080}:8080"
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.local
        required: false
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      - TZ=${TZ:-Europe/Paris}
      - HOST=0.0.0.0
      - PORT=8080
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '--spider'
        - 'http://127.0.0.1:8080/health'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
