# NocoDB: Airtable-style views over the local Supabase (dev only, localhost only).
# NocoDB's own metadata stays in SQLite on the volume below, never in Supabase.
# Supabase is added inside NocoDB as an external source (session pooler,
# host.docker.internal:54322) with the read-only role nocodb_ro.
name: nocodb
services:
  nocodb:
    build: .
    image: nocodb-local:2026.10.1
    container_name: nocodb
    restart: unless-stopped
    environment:
      NC_DB: "sqlite3:///?database=/usr/app/data/noco.db"
      NC_AUTH_JWT_SECRET: ${NC_AUTH_JWT_SECRET:?set in .env}
      NC_CONNECTION_ENCRYPT_KEY: ${NC_CONNECTION_ENCRYPT_KEY:?set in .env}
      NC_ADMIN_EMAIL: ${NC_ADMIN_EMAIL:?set in .env}
      NC_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:?set in .env}
      NC_PUBLIC_URL: http://localhost:8091
      NC_DISABLE_TELE: "true"
      NC_DISABLE_ERR_REPORTS: "true"
      NC_INVITE_ONLY_SIGNUP: "true"
      # Supabase runs on this machine: allow local hosts for external databases only
      # (webhooks and other outbound calls keep NocoDB's SSRF protection).
      NC_ALLOW_LOCAL_EXTERNAL_DBS: "true"
    volumes:
      - nocodb-data:/usr/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 1536m
    ports:
      - "127.0.0.1:8091:8080"
volumes:
  nocodb-data:
