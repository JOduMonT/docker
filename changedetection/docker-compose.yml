# https://github.com/linuxserver/docker-changedetection.io
services:
  changedetection:
    image: lscr.io/linuxserver/changedetection.io:0.60.6
    container_name: changedetection
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CHANGEDETECTION_PORT:-5000}:5000"
    volumes:
      - ./config:/config
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.local
        required: false
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-100}
      - TZ=${TZ:-Europe/Paris}
      - PLAYWRIGHT_DRIVER_URL=ws://browser-sockpuppet-chrome:3000
    # s6-overlay root->PUID/PGID drop dance — same set as jellyfin/qbittorrent/
    # postgres in this repo (docs/HARD-WON-GOTCHAS.md).
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '--spider'
        - 'http://127.0.0.1:5000/healthz'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  browser-sockpuppet-chrome:
    hostname: browser-sockpuppet-chrome
    image: dgtlmoon/sockpuppetbrowser:0.0.3
    container_name: browser-sockpuppet-chrome
    restart: unless-stopped
    init: true
    # Already runs as non-root "chrome" — no privilege-drop dance needed, but
    # scope capabilities to just what Chrome's sandbox needs instead of the
    # full default set (see docs/HARD-WON-GOTCHAS.md, "Chromium capability advice").
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
    security_opt:
      - no-new-privileges:true
    env_file:
      - path: ../.env
        required: false
      - path: ../.env.local
        required: false
      - path: .env
        required: false
      - path: .env.local
        required: false
    environment:
      - TZ=${TZ:-Europe/Paris}
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1024
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=10
    healthcheck:
      test:
        - CMD
        - wget
        - '-q'
        - '--spider'
        - 'http://127.0.0.1:3000/healthz'
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1536M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"